[project]
name = "website-audit-worker"
version = "0.1.0"
description = "Portable worker for auditing public business websites and submitting results to a CRM API."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

